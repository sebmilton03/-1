<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>+1</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
  :root {
    --bg: #0f0f10; --card: #1b1b1c; --line: #2c2c2a; --text: #f1efe8; --muted: #888780;
    --mint: #1D9E75; --mint-hi: #5DCAA5;
    --red-line: #A32D2D; --red-bg: #2a1515; --red-text: #F09595;
    --violet: #534AB7; --violet-hi: #AFA9EC; --violet-bg: #1a1833; --violet-text: #CECBF6;
  }
  body.blackout { --bg: #000; --card: #000; --line: #262626; --mint: #e8e6df; --mint-hi: #e8e6df; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; transition: background .6s;
  }
  main {
    max-width: 420px; min-height: 100%; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  }
  p { margin: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
  .dots { display: flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mint-hi); }
  .dot.none { background: none; border: 1px solid #444441; }
  h1 { margin: 18px 0 0; font-size: 48px; font-weight: 600; letter-spacing: -1px; line-height: 1.1; }
  .sub { margin-top: 4px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .strip { margin-top: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--red-line); background: var(--red-bg); color: var(--red-text); font-size: 14px; }

  .song { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--violet); background: var(--violet-bg); transition: opacity .5s, transform .5s; }
  .song.gone { opacity: 0; transform: scale(.96); }
  .song-t { font-size: 16px; font-weight: 600; color: var(--violet-text); }
  .song-s { margin-top: 2px; font-size: 14px; color: var(--violet-hi); }
  #note {
    position: relative; flex: none; width: 54px; height: 54px; padding: 0; border-radius: 50%;
    border: 2px solid var(--violet-hi); background: var(--violet); color: #EEEDFE;
    display: grid; place-items: center; animation: glow 2.4s ease-in-out infinite;
  }
  #note.armed { animation-duration: .7s; }
  #note:active { transform: scale(.94); }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 10px 1px rgba(175,169,236,.3); }
    50% { box-shadow: 0 0 0 5px rgba(175,169,236,.12), 0 0 26px 6px rgba(175,169,236,.55); }
  }
  .ring { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--violet-hi); animation: ring .9s ease-out forwards; pointer-events: none; }
  @keyframes ring { to { transform: scale(3.2); opacity: 0; } }
  .flynote { position: absolute; left: 50%; top: 50%; color: var(--violet-text); font-size: 20px; pointer-events: none; animation: flynote 1.1s ease-out forwards; }
  @keyframes flynote {
    from { transform: translate(-50%, -50%) scale(.6); opacity: 1; }
    to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--r)); opacity: 0; }
  }

  #btn {
    --p: 0;
    position: relative; flex: 1; min-height: 300px; margin-top: 20px; padding: 0;
    border: 1px solid var(--line); border-radius: 28px; background: var(--card);
    overflow: hidden; isolation: isolate; color: var(--text); font: inherit;
    touch-action: manipulation;
    transition: --p .35s cubic-bezier(.2,.8,.2,1), border-color .3s, transform .08s;
  }
  #btn:active { transform: scale(.985); }
  #btn.missed { border: 2px solid #E24B4A; }
  #btn.complete { border-color: var(--mint-hi); }
  #btn.burst::after { content: ''; position: absolute; inset: 0; border-radius: inherit; animation: burst .8s ease-out; pointer-events: none; }
  @keyframes burst { from { box-shadow: inset 0 0 0 0 rgba(255,255,255,.5); } to { box-shadow: inset 0 0 0 40px rgba(255,255,255,0); } }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--p) * 100%); background: var(--mint); }
  .lbl { position: absolute; left: 50%; display: flex; flex-direction: column; align-items: center; line-height: 1; font-variant-numeric: tabular-nums; pointer-events: none; }
  .lbl small { margin-top: 6px; font-size: 14px; display: flex; align-items: center; gap: 4px; }
  #leftL { top: clamp(44px, calc((1 - var(--p)) * 50%), calc(100% - 44px)); transform: translate(-50%, -50%); color: var(--muted); }
  #leftL b { font-size: 36px; font-weight: 600; }
  #doneL { bottom: clamp(60px, calc(var(--p) * 50%), calc(100% - 60px)); transform: translate(-50%, 50%); }
  #doneL b { font-size: 84px; font-weight: 600; letter-spacing: -2px; }
  .plus { position: absolute; font-size: 22px; font-weight: 600; pointer-events: none; animation: plus .7s ease-out forwards; }
  @keyframes plus { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(-50%, -140%); opacity: 0; } }
  body.blackout .lbl, body.blackout .plus { color: #fff; mix-blend-mode: difference; }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash 1.4s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
<main>
  <div class="top"><span>+1</span><span class="dots" id="dots"></span></div>
  <h1 id="title">Day 1</h1>
  <p class="sub" id="sub"></p>

  <p class="strip" id="strip" hidden></p>

  <div class="song" id="song" hidden>
    <button id="note" aria-label="Song made">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M13 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M9 17v-13h10v13"/><path d="M9 8h10"/></svg>
    </button>
    <div><p class="song-t" id="songT">Make a song</p><p class="song-s" id="songS"></p></div>
  </div>

  <button id="btn">
    <div class="fill"></div>
    <div class="lbl" id="leftL"><b id="leftN"></b><small>left</small></div>
    <div class="lbl" id="doneL"><b id="doneN"></b><small id="doneS">done</small></div>
  </button>
</main>
<div id="flash"></div>

<script>
  const CUTOFF = 4;        // a day ends at 4 AM, so late-night sets count for the day before
  const SONG_DAYS = 10;    // days to make a song after a miss with no skips left
  const BLACKOUT = 100;    // push-ups in one day to come back from blackout
  const KEY = 'plus-one-v1';

  // Days are whole numbers (days since 1970) so they're easy to compare and count.
  const dayOf = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
  function today() {
    const d = new Date(Date.now() - CUTOFF * 36e5);
    return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5;
  }

  // Where things stood when the app started: day 1 was Aug 23, day 16 was skipped,
  // and 362 push-ups were done before the app.
  function fresh() {
    return {
      start: dayOf('2026-08-23'),   // day 1 of the current run
      used: 1,                       // skips used this run
      base: 362,                     // push-ups done before the app
      done: {},                      // push-ups per day
      settled: dayOf('2026-09-18'),  // last day whose outcome is decided
      song: null,                    // last day to make the song, or null
      blackout: false,
      log: [[dayOf('2026-09-07'), 'skip']],  // [day, 'skip' | 'song-start' | 'song' | 'blackout' | 'rebirth']
    };
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || fresh(); }
    catch { return fresh(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  }
  let state = load();

  const dayNo = d => d - state.start + 1;
  // Start with one skip and earn one every 10 days (days 10, 20, 30...).
  const skipsLeft = d => 1 + Math.floor(dayNo(d) / 10) - state.used;
  // Before the run starts is only possible on the day of a rebirth, which took 100.
  const target = d => state.blackout || d < state.start ? BLACKOUT : dayNo(d);
  const total = () => Object.values(state.done).reduce((a, b) => a + b, state.base);

  // Decide every finished day not yet decided: missed days use a skip, then start
  // a song timer, then (a second miss, or the timer running out) go to blackout.
  function settle() {
    const t = today();
    let changed = false;
    while (state.settled < t - 1) {
      const d = ++state.settled;
      changed = true;
      if (state.blackout || d < state.start) continue;
      if ((state.done[d] || 0) < dayNo(d)) {
        if (skipsLeft(d) > 0) { state.used++; state.log.push([d, 'skip']); }
        else if (state.song !== null) { blackout(d); continue; }
        else { state.song = d + SONG_DAYS; state.log.push([d, 'song-start']); }
      }
      if (state.song !== null && d >= state.song) blackout(d);
    }
    if (changed) save();
  }
  function blackout(d) {
    state.blackout = true;
    state.song = null;
    state.log.push([d, 'blackout']);
  }
  // 100 in a day during blackout: a fresh run starts tomorrow at day 1 with one skip.
  function rebirth(d) {
    state.blackout = false;
    state.start = d + 1;
    state.used = 0;
    state.log.push([d, 'rebirth']);
  }

  const $ = id => document.getElementById(id);
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10"/></svg>';
  let shown = null;

  function render() {
    settle();
    const t = today();
    shown = t;
    const reborn = !state.blackout && t < state.start;
    const tgt = target(t);
    const n = Math.min(state.done[t] || 0, tgt);
    const skips = state.blackout || reborn ? 0 : skipsLeft(t);
    document.body.classList.toggle('blackout', state.blackout);

    $('dots').innerHTML = 'skips ' + (skips
      ? '<span class="dot"></span>'.repeat(skips)
      : '<span class="dot none"></span>');

    const tot = total().toLocaleString('en-US') + ' total';
    if (state.blackout) {
      $('title').textContent = 'Blackout';
      $('sub').textContent = tot + ' · 100 in a day to return';
    } else if (reborn) {
      $('title').textContent = 'Reborn';
      $('sub').textContent = tot + ' · day 1 starts tomorrow';
    } else {
      const k = dayNo(t) % 10;
      $('title').textContent = 'Day ' + dayNo(t);
      $('sub').textContent = tot + ' · ' + (k === 0 ? 'skip earned today' : 'next skip in ' + plural(10 - k, 'day'));
    }

    const usedSkip = !state.blackout && state.log.some(([d, e]) => d === t - 1 && e === 'skip');
    $('strip').hidden = !usedSkip;
    if (usedSkip) $('strip').textContent = 'Day ' + dayNo(t - 1) + ' missed · skip used · ' + skips + ' left';

    const song = state.song !== null && !state.blackout;
    if (song && $('song').hidden) $('song').classList.remove('gone');
    $('song').hidden = !song;
    if (song && !$('note').classList.contains('armed')) {
      const left = state.song - t + 1;
      $('songT').textContent = 'Make a song';
      $('songS').textContent = left === 1 ? 'Last day' : left + ' days left';
    }

    const complete = n >= tgt;
    $('btn').style.setProperty('--p', n / tgt);
    $('btn').classList.toggle('complete', complete);
    $('btn').classList.toggle('missed', usedSkip || song);
    $('leftL').hidden = complete;
    $('leftN').textContent = tgt - n;
    $('doneN').textContent = n;
    $('doneS').innerHTML = complete ? 'done ' + CHECK : 'done';
  }

  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

  $('btn').onclick = e => {
    render();
    const t = today(), tgt = target(t), n = state.done[t] || 0;
    if (n >= tgt) { buzz(20); return; }
    state.done[t] = n + 1;
    if (state.blackout && n + 1 >= BLACKOUT) rebirth(t);
    save();
    render();

    const r = $('btn').getBoundingClientRect();
    const plus = document.createElement('span');
    plus.className = 'plus';
    plus.textContent = '+1';
    plus.style.left = (e.clientX ? e.clientX - r.left : r.width / 2) + 'px';
    plus.style.top = (e.clientY ? e.clientY - r.top : r.height / 2) + 'px';
    $('btn').appendChild(plus);
    setTimeout(() => plus.remove(), 700);

    if (n + 1 >= tgt) {
      buzz([30, 60, 30]);
      $('btn').classList.remove('burst');
      void $('btn').offsetWidth;
      $('btn').classList.add('burst');
      if (t < state.start) { $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on'); }
    } else {
      buzz(8);
    }
  };

  // Tap the note once to arm it, then again to confirm the song is made.
  let armTimer = null;
  $('note').onclick = () => {
    const note = $('note');
    if (!note.classList.contains('armed')) {
      note.classList.add('armed');
      $('songT').textContent = 'Song made?';
      $('songS').textContent = 'Tap the note again';
      buzz(10);
      armTimer = setTimeout(() => { note.classList.remove('armed'); render(); }, 3000);
      return;
    }
    clearTimeout(armTimer);
    note.classList.remove('armed');
    state.song = null;
    state.log.push([today(), 'song']);
    save();
    buzz([20, 40, 20, 40, 60]);

    const ring = document.createElement('span');
    ring.className = 'ring';
    note.appendChild(ring);
    for (let i = 0; i < 7; i++) {
      const f = document.createElement('span');
      const a = (i / 7) * Math.PI * 2 - Math.PI / 2;
      f.className = 'flynote';
      f.textContent = i % 2 ? '♪' : '♫';
      f.style.setProperty('--dx', Math.cos(a) * 70 + 'px');
      f.style.setProperty('--dy', Math.sin(a) * 70 - 20 + 'px');
      f.style.setProperty('--r', (i % 2 ? 20 : -20) + 'deg');
      note.appendChild(f);
    }
    $('songT').textContent = 'Song made';
    $('songS').textContent = 'Nice.';
    setTimeout(() => $('song').classList.add('gone'), 900);
    setTimeout(() => { note.querySelectorAll('.ring, .flynote').forEach(x => x.remove()); render(); }, 1400);
  };

  render();
  setInterval(() => { if (today() !== shown) render(); }, 30000);
  document.addEventListener('visibilitychange', render);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
